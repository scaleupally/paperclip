# fly.toml app configuration file generated for priopilot on 2026-04-05T21:04:57-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'priopilot'
primary_region = 'sjc'

[build]

[[mounts]]
  source = 'paperclip'
  destination = '/paperclip'

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
