# fly.toml app configuration file generated for paperclip-icy-fog-8513 on 2026-04-11T10:10:18-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'paperclip-icy-fog-8513'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "paperclip"
  destination = "/paperclip"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
