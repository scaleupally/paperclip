# fly.toml app configuration file generated for priopilot on 2026-04-05T21:04:57-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'priopilot'
primary_region = 'sjc'

[env]
  PAPERCLIP_DEPLOYMENT_EXPOSURE = "public"
  PAPERCLIP_PUBLIC_URL = "https://priopilot.fly.dev"
  PAPERCLIP_AUTH_BASE_URL_MODE = "explicit"

[build]

[[mounts]]
  source = 'paperclip'
  destination = '/paperclip'

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 4096
